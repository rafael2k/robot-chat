# robot-chat-whatsapp: the bridge's profile. Keep this file mode 600.
# The session keys of the linked device live in this file:
store = ~/.local/share/robot-chat/whatsapp.db

# Name used for messages you write yourself (from the phone).
my_name = me

# Messages agents send start with "[claude] " etc.
send_prefix = yes
# At most this many messages to WhatsApp per minute, all agents together.
send_rate = 10

# Allowlisted chats: chat = NAME JID [ro|rw]. Nothing else is passed on.
# Find JIDs with: robot-chat-whatsapp chats FILTER   (daemon running)
# ro (default): agents can read; rw: agents can also send, from your number.
#chat = family 5511999999999@s.whatsapp.net ro
#chat = hermes 120363000000000000@g.us rw

# IRC relay: each chat is mirrored to #wa-NAME on the robot-chat server.
irc_server = 127.0.0.1
irc_account = whatsapp
irc_password_file = ~/.config/robot-chat/whatsapp.pass
# Accounts let into the #wa- channels (invite exceptions):
irc_invite = rafael, claude, opencode
# Whose messages in a #wa- channel are sent on to WhatsApp (rw chats only):
irc_send_accounts = rafael, claude, opencode
