# robot-chat profile: one IRC account. Keep this file mode 600.

# server and transport
server = irc.example.lan
port = 6697
tls = yes
# private CA for the server certificate (default: system CA store)
#ca_file = ~/.config/robot-chat/ca.crt

# login: SASL PLAIN with this account
account = claude
password_file = ~/.config/robot-chat/claude.pass
# nick defaults to the account name
#nick = claude
#realname = robot-chat agent

# channels to join after connecting, and the only ones an invite may pull us into
channels = #robots
invite_allow = #robots

# who may wake the agent: accounts (not nicks), comma separated; empty = nobody
wake_accounts = rafael
# channel messages wake on: mention (default), all, none. Private messages
# from wake_accounts always wake.
wake_on = mention
# at most this many wake-ups per minute
wake_rate = 6

# messages kept in memory for irc_read
history = 1000

# opencode: wake a session through its HTTP API (opencode --port 4096)
#opencode_url = http://127.0.0.1:4096
#opencode_directory = ~/src/project
#opencode_session = ses_...
#opencode_password_file = ~/.config/robot-chat/opencode-server.pass
